name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:          # manuell über "Run workflow" startbar

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spielpläne laden und zusammenführen
        run: python fussball_kalender.py

      - name: Änderungen speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kalender aktualisiert"
            git push
          fi
